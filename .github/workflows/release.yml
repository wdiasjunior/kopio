name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    # oldest supported LTS = oldest glibc = widest AppImage compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev \
            qt6-image-formats-plugins libgl1-mesa-dev patchelf libfuse2

      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          ctest --test-dir build --output-on-failure
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export QMAKE=/usr/bin/qmake6
          # kopio decodes webp/gif through Qt plugins — make sure they ship
          export EXTRA_QT_PLUGINS="imageformats"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv kopio-*.AppImage kopio-x86_64.AppImage

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: kopio-x86_64.AppImage

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtimageformats'

      - name: Build and test
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/kopio.exe, build/Release/kopio-scan.exe dist/
          windeployqt --release --no-translations dist/kopio.exe
          Compress-Archive -Path dist/* -DestinationPath kopio-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: kopio-windows-x64.zip
