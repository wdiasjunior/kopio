name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    # oldest supported LTS = oldest glibc = widest AppImage compatibility;
    # Qt itself comes from the official 6.8 binaries (via aqt), which ship the
    # xdgdesktopportal platform theme -> native file dialogs + dark mode
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtimageformats'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf libfuse2 \
            libgl1-mesa-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0

      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
          ctest --test-dir build --output-on-failure
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # imageformats plugins (qwebp/qgif/...) are deployed automatically
          # with the gui module; linuxdeploy names the output kopio-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          test -f kopio-x86_64.AppImage
          # the portal platform theme must be in the bundle for native dialogs
          test -f AppDir/usr/plugins/platformthemes/libqxdgdesktopportal.so

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: kopio-x86_64.AppImage

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtimageformats'

      - name: Build and test
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/kopio.exe, build/Release/kopio-scan.exe dist/
          windeployqt --release --no-translations dist/kopio.exe
          Compress-Archive -Path dist/* -DestinationPath kopio-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: kopio-windows-x64.zip
